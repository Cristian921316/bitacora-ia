<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configuración · Bitácora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <script src="/assets/nav.js"></script>

  <main class="max-w-3xl mx-auto p-4 space-y-5">
    <h1 class="text-xl font-bold">⚙️ Configuración</h1>
    <p class="text-sm text-slate-400">Los cambios se aplican de inmediato en el servidor. Las pantallas de garita abiertas se ponen al día
      en unos 2 minutos (o al recargar).</p>
    <div id="lista" class="space-y-4"></div>
  </main>

<script>
const $ = id => document.getElementById(id);
function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function tarjeta(p) {
  const quien = p.actualizado_por ? `Último cambio: ${esc(p.actualizado_por)}, ${esc(p.actualizado_en.replace('T', ' '))}` : 'Sin cambios: usa el valor por defecto';
  return `<section class="bg-slate-800 border border-slate-700 rounded-xl p-4" data-clave="${esc(p.clave)}">
    <h2 class="font-semibold">${esc(p.titulo)}</h2>
    <p class="text-sm text-slate-400 mt-1">${esc(p.ayuda)}</p>
    <div class="mt-3 flex flex-wrap items-center gap-3">
      ${p.tipo === 'switch'
        ? `<select class="valor rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm text-slate-100">
             <option value="1" ${p.valor ? 'selected' : ''}>Sí, controlar</option>
             <option value="0" ${p.valor ? '' : 'selected'}>No (por ahora)</option></select>`
        : `<input type="number" min="${p.min}" max="${p.max}" step="1" value="${p.valor}"
             class="valor w-28 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm text-slate-100" />
           <span class="text-sm text-slate-300">${esc(p.unidad)}</span>`}
      <button class="guardar px-4 py-2 rounded-lg bg-green-600 hover:bg-green-500 font-semibold text-sm">Guardar</button>
      <button class="defecto text-xs text-slate-400 hover:text-slate-200 underline" data-defecto="${p.defecto}">Volver al valor por defecto (${p.tipo === 'switch' ? (p.defecto ? 'sí' : 'no') : p.defecto})</button>
      <span class="msg text-sm"></span>
    </div>
    <p class="text-xs text-slate-500 mt-2">${p.tipo === 'switch' ? '' : `Permitido: de ${p.min} a ${p.max} ${esc(p.unidad)} · `}${quien}</p>
  </section>`;
}

async function cargar() {
  const ps = await (await fetch('/api/parametros')).json();
  $('lista').innerHTML = ps.map(tarjeta).join('');
}

async function guardar(sec, valor) {
  const msg = sec.querySelector('.msg');
  const res = await fetch('/api/parametros/' + sec.dataset.clave, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ valor }),
  });
  const data = await res.json();
  if (!res.ok) {
    msg.textContent = '❌ ' + (typeof data.detail === 'string' ? data.detail : 'Valor no válido');
    msg.className = 'msg text-sm text-red-300';
    return;
  }
  await cargar();
  const nuevo = document.querySelector(`[data-clave="${sec.dataset.clave}"] .msg`);
  nuevo.textContent = '✅ Guardado'; nuevo.className = 'msg text-sm text-green-300';
}

$('lista').onclick = e => {
  const sec = e.target.closest('section'); if (!sec) return;
  if (e.target.closest('.guardar')) guardar(sec, parseInt(sec.querySelector('.valor').value, 10));
  if (e.target.closest('.defecto')) {
    guardar(sec, parseInt(e.target.closest('.defecto').dataset.defecto, 10));
  }
};
cargar();
</script>
</body>
</html>
