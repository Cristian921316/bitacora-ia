<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garita · Bitácora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .col-scroll { scrollbar-width: thin; scrollbar-color: #475569 transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">
  <script src="/assets/nav.js"></script>
  <header class="flex flex-wrap items-center gap-3 px-4 py-3 bg-slate-800 shadow">
    <h1 class="text-xl font-bold whitespace-nowrap">🛡️ Garita</h1>
    <div class="relative flex-1 min-w-[220px] max-w-xl">
      <input id="buscar" type="search" autocomplete="off"
        placeholder="Buscar: Mz 6 Villa 23, nombre o placa…  ( / )"
        class="w-full rounded-lg bg-slate-900 border border-slate-600 focus:border-indigo-400 focus:outline-none px-3 py-2 text-sm placeholder-slate-500" />
    </div>
    <span id="resumen" class="text-xs text-slate-400 hidden"></span>
    <button id="btnSinAviso" class="text-sm px-3 py-1.5 rounded bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold whitespace-nowrap">➕ Visita sin aviso</button>
    <div class="flex items-center gap-3 ml-auto">
      <span id="conn" class="text-xs px-2 py-1 rounded bg-red-600">Desconectado</span>
      <button id="btnSonido" class="text-sm px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 whitespace-nowrap">🔇 Activar sonido</button>
    </div>
  </header>

  <main id="grid" class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
    <section class="flex flex-col min-h-0">
      <h2 class="text-base font-semibold mb-2 text-purple-300">Esperando autorización (<span id="cnt0">0</span>)</h2>
      <ul id="col0" class="col-scroll flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1"></ul>
    </section>
    <section class="flex flex-col min-h-0">
      <h2 class="text-base font-semibold mb-2 text-amber-300">Pre-autorizados por llegar (<span id="cnt1">0</span>)</h2>
      <ul id="col1" class="col-scroll flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1"></ul>
    </section>
    <section id="secAdentro" class="hidden flex flex-col min-h-0">
      <h2 class="text-base font-semibold mb-2 text-green-300">Adentro del Conjunto (<span id="cnt2">0</span>) <span id="alertaAyer" class="hidden ml-1 text-xs px-2 py-0.5 rounded bg-red-700 text-red-100 align-middle"></span></h2>
      <ul id="col2" class="col-scroll flex-1 overflow-y-auto flex flex-col gap-1.5 pr-1"></ul>
    </section>
  </main>

  <!-- Ventana: registrar una visita que llegó sin avisar -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
    <form id="formSinAviso" class="bg-slate-800 border border-slate-600 rounded-xl p-5 w-full max-w-md grid grid-cols-2 gap-3">
      <h3 class="col-span-2 text-lg font-bold">➕ Visita sin aviso</h3>
      <p class="col-span-2 text-xs text-slate-400 -mt-1">Escribe la manzana y la villa: te muestro quién vive ahí para que confirmes con el visitante.</p>
      <label class="text-xs text-slate-400">Manzana
        <input id="saMz" required maxlength="50" placeholder="6" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm" /></label>
      <label class="text-xs text-slate-400">Villa
        <input id="saVilla" required maxlength="50" placeholder="23" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm" /></label>
      <div id="saCasa" class="col-span-2 hidden"></div>
      <label class="col-span-2 text-xs text-slate-400">Nombre del visitante
        <input id="saNombre" required maxlength="80" placeholder="Juan Pérez" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm" /></label>
      <label class="text-xs text-slate-400">Tipo
        <select id="saTipo" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm">
          <option value="VISITA">Visita</option><option value="DELIVERY">Delivery</option>
          <option value="TAXI_UBER">Taxi/Uber</option><option value="SERVICIO_TECNICO">Servicio técnico</option>
        </select></label>
      <label class="text-xs text-slate-400">Placa (opcional)
        <input id="saPlaca" maxlength="12" placeholder="ABC123" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm" /></label>
      <label class="col-span-2 text-xs text-slate-400">Observaciones (opcional)
        <input id="saObs" maxlength="200" class="block w-full mt-1 rounded bg-slate-900 border border-slate-600 px-3 py-2 text-sm" /></label>
      <div class="col-span-2 flex justify-end gap-2 mt-1">
        <button type="button" id="saCancelar" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">Cancelar</button>
        <button id="saEnviar" disabled class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold text-sm opacity-50">Preguntar al residente</button>
      </div>
    </form>
  </div>
  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm shadow-lg z-50"></div>

<script>
const ICONOS = { VISITA: '🧑', DELIVERY: '📦', TAXI_UBER: '🚕', SERVICIO_TECNICO: '🛠️' };
const TIPOS = { VISITA: 'Visita', DELIVERY: 'Delivery', TAXI_UBER: 'Taxi/Uber', SERVICIO_TECNICO: 'Serv. técnico' };
const registros = new Map();
let audioCtx = null, sonido = false, filtro = '';
// Parámetros del servidor y su reloj: así las vigencias y los "hace N min" no dependen de la zona horaria del navegador
let CFG = { vigencia_horas: 12, rechazo_visible_minutos: 30, control_salidas: false }, desfaseMs = 0;
async function cargarConfig() {
  CFG = await (await fetch('/api/config')).json();
  desfaseMs = Date.parse(CFG.ahora_servidor) - Date.now();
}
const ahoraServidor = () => Date.now() + desfaseMs;
function hoyServidor() {
  const d = new Date(ahoraServidor()), z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
// Adentro desde un día anterior: hay que revisarlo
const esDeAyer = r => r.estado === 'ADENTRO' && ((r.hora_ingreso || r.fecha_hora || '').slice(0, 10) < hoyServidor());

function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// minúsculas y sin acentos, para que "perez" encuentre "Pérez"
function norm(s) { return (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

function beep() {
  if (!sonido || !audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

document.getElementById('btnSonido').onclick = e => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  sonido = !sonido;
  e.target.textContent = sonido ? '🔊 Sonido activo' : '🔇 Activar sonido';
  if (sonido) beep();
};

function hora(fh) { return (fh || '').replace('T', ' ').slice(5, 16); } // MM-DD HH:MM

function fila(r, accion, label, color) {
  const detalle = [r.observaciones, r.autorizado_por, r.fecha_hora && r.fecha_hora.replace('T', ' ')].filter(Boolean).join(' · ');
  const ayer = esDeAyer(r);
  return `<li title="${esc(detalle)}" class="rounded-lg px-3 py-2 flex items-center gap-3 border ${ayer ? 'bg-red-950/60 border-red-500' : 'bg-slate-800 border-slate-700'}">
    <div class="text-xl leading-none">${ayer ? '⚠️' : (ICONOS[r.tipo] || '🧑')}</div>
    <div class="flex-1 min-w-0 leading-tight">
      <div class="font-semibold text-sm truncate">${esc(r.nombre_visitante)}</div>
      <div class="text-xs ${ayer ? 'text-red-300' : 'text-slate-400'} truncate">🏠 ${esc(r.casa)} · ${esc(TIPOS[r.tipo] || r.tipo)}${r.placa ? ' · 🚗 ' + esc(r.placa) : ''} · ${ayer ? 'Adentro desde ' + esc(hora(r.hora_ingreso || r.fecha_hora)) : esc(hora(r.fecha_hora))}${r.hora_respuesta && r.estado === 'PRE_AUTORIZADO' ? ' · ✅ Autorizó en puerta' : ''}${r.observaciones ? ' · ' + esc(r.observaciones) : ''}</div>
    </div>
    <button onclick="cambiar(${r.id}, '${accion}')" class="px-3 py-1.5 rounded-md text-xs font-semibold whitespace-nowrap ${color}">${label}</button>
  </li>`;
}

function minutos(fh) { const t = Date.parse(fh); return isNaN(t) ? 0 : Math.max(0, Math.round((ahoraServidor() - t) / 60000)); }

// Filas de la columna "Esperando autorización": pendientes y rechazos recientes
function filaEspera(r) {
  const base = `🏠 ${esc(r.casa)} · ${esc(TIPOS[r.tipo] || r.tipo)}${r.placa ? ' · 🚗 ' + esc(r.placa) : ''}`;
  if (r.estado === 'RECHAZADO') {
    return `<li class="bg-red-950/60 rounded-lg px-3 py-2 flex items-center gap-3 border border-red-500">
      <div class="text-xl leading-none">⛔</div>
      <div class="flex-1 min-w-0 leading-tight">
        <div class="font-semibold text-sm truncate">${esc(r.nombre_visitante)}</div>
        <div class="text-xs text-red-300 truncate">${base} · El residente NO autorizó · hace ${minutos(r.hora_respuesta)} min</div>
      </div></li>`;
  }
  const aQuien = ((r.autorizado_por || '').match(/se preguntó a (.+)\)$/) || [])[1];
  return `<li class="bg-slate-800 rounded-lg px-3 py-2 flex items-center gap-3 border border-purple-500">
    <div class="text-xl leading-none">⏳</div>
    <div class="flex-1 min-w-0 leading-tight">
      <div class="font-semibold text-sm truncate">${esc(r.nombre_visitante)}</div>
      <div class="text-xs text-purple-300 truncate">${base} · esperando respuesta${aQuien ? ' de ' + esc(aQuien) : ''} · hace ${minutos(r.fecha_hora)} min</div>
    </div>
    <div class="flex flex-col gap-1 shrink-0">
      <button onclick="ingresarIgual(${r.id})" class="px-2 py-1 rounded-md text-xs font-semibold bg-amber-600 hover:bg-amber-500 whitespace-nowrap">Ingresar igual</button>
      <button onclick="cambiar(${r.id}, 'SALIO')" class="px-2 py-1 rounded-md text-xs font-semibold bg-slate-600 hover:bg-slate-500 whitespace-nowrap">Se retiró</button>
    </div></li>`;
}

function ingresarIgual(id) {
  if (confirm('El residente todavía no responde.\n¿Dar ingreso de todos modos?')) cambiar(id, 'ADENTRO');
}

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm shadow-lg z-50 ' + (ok ? 'bg-green-700' : 'bg-amber-600');
  setTimeout(() => t.classList.add('hidden'), 6000);
}

// Extrae manzana y villa de un texto ya normalizado. Acepta "mz 6 villa 23", "mz6 v23", "manzana 6 casa 23" o "6 23".
function parseCasa(t) {
  let mz = null, vi = null;
  let resto = t.replace(/\b(?:mz|mza|manzana)\.?(?:\s+|(?=\d))([a-z0-9]+)/, (_, x) => { mz = x; return ' '; });
  resto = resto.replace(/\b(?:villa|casa|lote)\.?\s*([a-z0-9]+)/, (_, x) => { vi = x; return ' '; });
  if (vi === null) resto = resto.replace(/\bv\.?\s*(\d+)\b/, (_, x) => { vi = x; return ' '; });
  resto = resto.trim();
  const nums = resto.match(/^(\d+)\s+(\d+)$/);            // solo "6 23"
  if (mz === null && vi === null && nums) { mz = nums[1]; vi = nums[2]; resto = ''; }
  return { mz, vi, resto };
}

// Se calcula UNA vez por registro (no en cada tecla) para que buscar sea instantáneo.
function indexar(r) {
  const c = parseCasa(norm(r.casa));
  r._mz = c.mz; r._vi = c.vi;
  if (c.mz === null && c.vi === null && /^[a-z0-9]+$/.test(norm(r.casa))) r._vi = norm(r.casa); // casa simple, ej. "12"
  r._txt = norm([r.nombre_visitante, r.casa, r.placa, r.tipo, TIPOS[r.tipo], r.observaciones, r.autorizado_por].join(' '));
  return r;
}

let consulta = { mz: null, vi: null, tokens: [] };
function prepararConsulta(texto) {
  const c = parseCasa(texto);
  consulta = { mz: c.mz, vi: c.vi, tokens: c.resto ? c.resto.split(/\s+/) : [] };
}

function coincide(r) {
  if (!filtro) return true;
  if (consulta.mz !== null && r._mz !== consulta.mz) return false;   // manzana exacta
  if (consulta.vi !== null && r._vi !== consulta.vi) return false;   // villa exacta
  return consulta.tokens.every(t => r._txt.includes(t));             // palabras restantes (nombre, placa…)
}

function render() {
  const all = [...registros.values()].sort((a, b) => b.id - a.id); // más recientes arriba
  const vis = all.filter(coincide);
  const vigente = r => minutos(r.fecha_hora) <= CFG.vigencia_horas * 60;  // las vencidas ya no se muestran
  const espera = vis.filter(r => (r.estado === 'PENDIENTE' && vigente(r)) ||
                                 (r.estado === 'RECHAZADO' && minutos(r.hora_respuesta) <= CFG.rechazo_visible_minutos));
  const pre = vis.filter(r => r.estado === 'PRE_AUTORIZADO' && vigente(r));
  const dentro = !CFG.control_salidas ? [] : vis.filter(r => r.estado === 'ADENTRO').sort((a, b) => (esDeAyer(b) - esDeAyer(a)) || (b.id - a.id));  // los de ayer primero
  const rezagados = dentro.filter(esDeAyer).length;
  const aviso = document.getElementById('alertaAyer');
  aviso.classList.toggle('hidden', !rezagados);
  aviso.textContent = `⚠️ ${rezagados} desde ayer`;
  // Con el control de salidas apagado (piloto) la garita solo muestra pre-autorizadas y pendientes de autorizar
  document.getElementById('secAdentro').classList.toggle('hidden', !CFG.control_salidas);
  document.getElementById('grid').className = 'flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 gap-4 p-4' +
    (CFG.control_salidas ? ' lg:grid-cols-3' : '');
  const vacio = msg => `<li class="text-slate-500 text-sm px-1">${msg}</li>`;
  const MAX = 100; // pintar solo lo más reciente; el contador sí muestra el total
  const pintar = (lista, accion, label, color, vacioMsg) => {
    if (!lista.length) return vacio(filtro ? 'Sin resultados' : vacioMsg);
    const resto = lista.length - MAX;
    return lista.slice(0, MAX).map(r => fila(r, accion, label, color)).join('')
      + (resto > 0 ? vacio(`+${resto} más antiguos · afina la búsqueda`) : '');
  };
  document.getElementById('col0').innerHTML = espera.map(filaEspera).join('') || vacio(filtro ? 'Sin resultados' : 'Nadie esperando');
  document.getElementById('cnt0').textContent = espera.filter(r => r.estado === 'PENDIENTE').length;
  document.getElementById('col1').innerHTML = pintar(pre, 'ADENTRO', 'Ingreso ➜', 'bg-green-600 hover:bg-green-500', 'Nadie por llegar');
  document.getElementById('col2').innerHTML = pintar(dentro, 'SALIO', '⬅ Salida', 'bg-red-600 hover:bg-red-500', 'Nadie adentro');
  document.getElementById('cnt1').textContent = pre.length;
  document.getElementById('cnt2').textContent = dentro.length;
  const resumen = document.getElementById('resumen');
  resumen.classList.toggle('hidden', !filtro);
  resumen.textContent = `${espera.length + pre.length + dentro.length} resultado(s)`;
}

const inputBuscar = document.getElementById('buscar');
function aplicarFiltro() { filtro = norm(inputBuscar.value).trim(); prepararConsulta(filtro); render(); }
inputBuscar.addEventListener('input', aplicarFiltro);
inputBuscar.addEventListener('keydown', e => { if (e.key === 'Escape') { inputBuscar.value = ''; aplicarFiltro(); } });
document.addEventListener('keydown', e => {
  const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (e.key === '/' && !enCampo) { e.preventDefault(); inputBuscar.focus(); }
});

async function cambiar(id, estado) {
  const res = await fetch('/api/cambiar-estado/' + id, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado })
  });
  if (!res.ok) alert((await res.json()).detail || 'Error');
}

async function cargar() {
  await cargarConfig();
  registros.clear();
  (await (await fetch('/api/accesos')).json()).forEach(r => registros.set(r.id, indexar(r)));
  render();
}

function conectarWS() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/bitacora`);
  const conn = document.getElementById('conn');
  ws.onopen = () => { conn.textContent = 'En vivo'; conn.className = 'text-xs px-2 py-1 rounded bg-green-600'; cargar(); };
  ws.onmessage = e => { const m = JSON.parse(e.data); registros.set(m.registro.id, indexar(m.registro)); render(); beep(); };
  ws.onclose = () => { fetch('/api/yo'); /* si la sesión expiró, vuelve al login */ conn.textContent = 'Desconectado'; conn.className = 'text-xs px-2 py-1 rounded bg-red-600'; setTimeout(conectarWS, 2000); };
}

// --- Visita sin aviso ---
const modal = document.getElementById('modal'), formSA = document.getElementById('formSinAviso');
const sa = id => document.getElementById(id);
let saTimer = null, saInfo = null;   // saInfo = lo que la API dijo de la casa escrita (null = aún no se sabe)

function saSeleccionados() { return [...sa('saCasa').querySelectorAll('input.sa-res:checked')].map(c => +c.value); }
function saIgual() { const c = sa('saIgual'); return !!(c && c.checked); }

// El botón dice a quién se va a preguntar y solo se activa cuando hay una decisión clara
function saBoton() {
  const b = sa('saEnviar'); let texto = 'Preguntar al residente', ok = true;
  if (!saInfo || saInfo.cargando || saInfo.bloqueada || !saInfo.existe) ok = false;
  else if (saInfo.hay_avisables) {
    const ids = saSeleccionados();
    if (!ids.length) { ok = false; texto = 'Elige a quién preguntar'; }
    else {
      const nombres = saInfo.residentes.filter(r => ids.includes(r.id)).map(r => r.nombre);
      texto = ids.length === 1 ? 'Preguntar a ' + nombres[0] : `Preguntar a ${ids.length} personas`;
    }
  } else { texto = 'Registrar sin avisar'; ok = saIgual(); }
  b.textContent = texto; b.disabled = !ok; b.classList.toggle('opacity-50', !ok);
}

function saLimpiar() {
  clearTimeout(saTimer); saInfo = null;
  sa('saCasa').className = 'col-span-2 hidden'; sa('saCasa').innerHTML = ''; saBoton();
}

const saCasillaIgual = txt => `<label class="flex items-center gap-2 mt-2 text-amber-200 text-xs"><input type="checkbox" id="saIgual"> ${txt}</label>`;

function saPintar(d) {
  const p = sa('saCasa');
  const avisables = d.residentes.filter(r => r.avisable);
  saInfo = { ...d, hay_avisables: avisables.length > 0 };
  if (d.bloqueada) {
    p.className = 'col-span-2 rounded-lg border border-red-500 bg-red-950/40 px-3 py-2 text-sm';
    p.innerHTML = `<div class="font-semibold text-red-300">🚫 ${esc(d.mensaje)}</div>`;
  } else if (d.residentes.length) {
    p.className = 'col-span-2 rounded-lg border border-green-600 bg-green-950/40 px-3 py-2 text-sm';
    p.innerHTML = `<div class="font-semibold text-green-300">🏠 ${esc(d.casa)} · ¿A quién va a visitar?</div>
      <div class="mt-1 space-y-1">${d.residentes.map(r => `<label class="flex items-center gap-2 ${r.avisable ? '' : 'opacity-60'}">
        <input type="checkbox" class="sa-res" value="${r.id}" ${r.avisable ? 'checked' : 'disabled'}> <span class="font-medium">${esc(r.nombre)}</span>
        ${r.avisable ? '' : '<span class="text-xs text-amber-300">(sin celular: no se le puede avisar)</span>'}</label>`).join('')}</div>
      <div class="text-xs text-slate-400 mt-1">Confirma con el visitante que va a ver a esta persona.</div>` +
      (avisables.length ? '' : saCasillaIgual('Registrar igual: nadie de esta casa puede recibir el aviso por WhatsApp'));
  } else if (d.sugerencias.length) {
    p.className = 'col-span-2 rounded-lg border border-amber-500 bg-amber-950/40 px-3 py-2 text-sm';
    p.innerHTML = `<div class="font-semibold text-amber-300">Hay ${d.sugerencias.length} casas que coinciden con ${esc(d.casa)}.</div>
      <div class="text-xs text-slate-300 mt-1">Toca la correcta:</div>` +
      d.sugerencias.map((x, i) => `<button type="button" data-i="${i}" class="sa-sug block w-full text-left mt-1 rounded bg-slate-700 hover:bg-slate-600 px-2 py-1 text-xs">
        Mz ${esc(x.mz)} · Villa ${esc(x.villa)} — ${x.bloqueada ? '🚫 el residente no está al día, debe comunicarse con administración' : esc(x.residentes.join(', '))}</button>`).join('');
  } else {
    p.className = 'col-span-2 rounded-lg border border-red-500 bg-red-950/40 px-3 py-2 text-sm';
    p.innerHTML = `<div class="font-semibold text-red-300">No existe la casa ${esc(d.casa)}.</div>
      <div class="text-xs text-slate-300 mt-1">Confirma con el visitante la manzana y la villa: sin una casa válida no se puede registrar.</div>`;
  }
  saBoton();
}

async function saBuscar(exacta) {
  const mz = saMz.value.trim(), villa = saVilla.value.trim();
  if (!mz || !villa) { saLimpiar(); return; }
  saInfo = { cargando: true }; saBoton();
  let d = null;
  try {
    const res = await fetch(`/api/casa/residentes?mz=${encodeURIComponent(mz)}&villa=${encodeURIComponent(villa)}${exacta === true ? '&exacta=1' : ''}`);
    if (res.ok) d = await res.json();
  } catch (e) { /* sin conexión */ }
  if (saMz.value.trim() !== mz || saVilla.value.trim() !== villa) return;   // ya escribió otra cosa: respuesta vieja
  if (!d) {   // no se pudo verificar la casa: no se puede registrar
    saInfo = { existe: false, residentes: [], sugerencias: [] }; saBoton();
    const p = sa('saCasa');
    p.className = 'col-span-2 rounded-lg border border-red-500 bg-red-950/40 px-3 py-2 text-sm';
    p.innerHTML = '<div class="font-semibold text-red-300">No se pudo verificar la casa. Revisa la conexión y vuelve a intentar.</div>';
    return;
  }
  saPintar(d);
}
const saProgramar = () => { clearTimeout(saTimer); saInfo = null; saBoton(); saTimer = setTimeout(saBuscar, 350); };
saMz.addEventListener('input', saProgramar); saVilla.addEventListener('input', saProgramar);

sa('saCasa').addEventListener('change', saBoton);
sa('saCasa').addEventListener('click', e => {
  const b = e.target.closest('.sa-sug'); if (!b) return;
  const x = saInfo.sugerencias[+b.dataset.i];
  saMz.value = x.mz; saVilla.value = x.villa; saBuscar(true);
});

document.getElementById('btnSinAviso').onclick = () => { formSA.reset(); saLimpiar(); modal.classList.remove('hidden'); saMz.focus(); };
document.getElementById('saCancelar').onclick = () => modal.classList.add('hidden');
formSA.onsubmit = async e => {
  e.preventDefault();
  if (!saInfo || saInfo.cargando || sa('saEnviar').disabled) return;
  const res = await fetch('/api/visita-sin-aviso', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mz: saMz.value, villa: saVilla.value, nombre_visitante: saNombre.value, tipo: saTipo.value,
      placa: saPlaca.value || null, observaciones: saObs.value || null,
      residente_ids: saInfo.hay_avisables ? saSeleccionados() : [],     // a quién se le pregunta; [] = registrar sin avisar
    }),
  });
  const data = await res.json();
  if (!res.ok) { toast('❌ ' + (typeof data.detail === 'string' ? data.detail : 'Error al registrar'), false); return; }
  modal.classList.add('hidden'); formSA.reset(); saLimpiar();
  registros.set(data.registro.id, indexar(data.registro)); render();
  toast(data.preguntado_a.length
    ? `📲 Se preguntó a ${data.preguntado_a.join(', ')} por WhatsApp`
    : '⚠️ Visita registrada sin avisar a nadie: confirma por otro medio', !!data.preguntado_a.length);
};

setInterval(render, 30000);  // refresca los "hace N min" y oculta lo que acaba de vencer
setInterval(cargar, 120000); // cada 2 min recarga la lista y los parámetros (por si el administrador los cambió)
cargar(); conectarWS();
</script>
</body>
