# Producción en un VPS: HTTPS (Caddy) + app. WhatsApp va directo a Whapi.Cloud (sin contenedores propios para WhatsApp).
# Uso en el servidor:  docker compose up -d --build     (ver docs/DESPLIEGUE.md)
name: bitacora

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # evita que los registros llenen el disco

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en el archivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados: no borrar (Let's Encrypt limita las emisiones)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      DATABASE_URL: sqlite:////data/bitacora.db
      COOKIE_SECURE: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Falta OPENAI_API_KEY en el archivo .env}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WHAPI_TOKEN: ${WHAPI_TOKEN:?Falta WHAPI_TOKEN en el archivo .env}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Falta WEBHOOK_TOKEN en el archivo .env}
      ADMIN_TELEFONOS: ${ADMIN_TELEFONOS:-}
      SESION_HORAS: ${SESION_HORAS:-12}
      BLOQUEO_POR_MORA: ${BLOQUEO_POR_MORA:-1}
    volumes:
      - app_data:/data          # aquí vive bitacora.db (y sus respaldos)
    logging: *logging

volumes:
  app_data:
  caddy_data:
  caddy_config:
